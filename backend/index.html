<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Drop</title>
    <link rel="manifest" href="manifest.json">
</head>
<body
    style="font-family: sans-serif; text-align: center; padding: 50px; min-height: 100vh; margin: 0; background-color: #111; color: white; overflow-x: hidden;">

    <h1>spatial drop</h1>
    <p>status: <span id="status" style="color: red;">disconnected</span></p>

    <p id="debug" style="color: #888; font-size: 0.8rem; word-break: break-all; padding: 0 10px;"></p>

    <div style="margin-top: 30px; padding: 20px; background: #222; border-radius: 10px; display: inline-block;">
        <p style="margin: 0 0 10px 0; color: #888;">1. pick anything</p>
        <input type="file" id="filePicker" multiple style="color: white;">
    </div>

    <p style="margin-top: 50px; color: #555; font-size: 1.2rem;">2. swipe UP anywhere to drop</p>

    <script>
        function debugLog(msg) {
            console.log(msg);
            const el = document.getElementById('debug');
            el.innerText = String(msg);
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(err => {
                console.log('service worker registration failed (not a big deal):', err);
            });
        }

        // FIXED: this was `process.env.FIREBASE_URL` — but this is a
        // plain browser page, not Node.js. `process` doesn't exist in
        // a browser at all, so this line was crashing immediately,
        // before connect() ever even ran. hardcoded back to the real
        // value (same one server.js uses via its .env file).
        //
        // real fix for "duplicated in two places," if you want it
        // later: add a tiny GET /api/config route on the server that
        // returns { firebaseUrl: process.env.FIREBASE_URL } — that
        // code runs on the SERVER, which does have process.env — and
        // have this page fetch() that once on load instead.
        const FIREBASE_DB_URL = "https://spatial-drop-default-rtdb.firebaseio.com";

        const roomPin = prompt("enter the pin shown on your laptop:");
        debugLog(`pin entered: "${roomPin}"`);

        let laptopip = null;
        let ws;

        async function resolveLaptopIp() {
            document.getElementById('status').innerText = 'looking up your laptop...';

            try {
                const url = `${FIREBASE_DB_URL}/pins/${roomPin}.json`;
                debugLog(`fetching: ${url}`);

                const res = await fetch(url);
                debugLog(`firebase responded with status ${res.status}`);

                const data = await res.json();
                debugLog(`firebase data: ${JSON.stringify(data)}`);

                if (!data || !data.ip) {
                    document.getElementById('status').innerText = 'pin not found. check it and reload.';
                    document.getElementById('status').style.color = 'red';
                    return null;
                }

                return data.ip;
            } catch (err) {
                debugLog(`FETCH ERROR: ${err.message}`);
                document.getElementById('status').innerText = 'error looking up laptop — see debug line below';
                document.getElementById('status').style.color = 'red';
                return null;
            }
        }

        async function connect() {
            laptopip = await resolveLaptopIp();
            if (!laptopip) return;

            debugLog(`connecting to ws://${laptopip}:3000`);
            ws = new WebSocket(`ws://${laptopip}:3000`);

            ws.onopen = () => {
                debugLog('websocket opened successfully');
                document.getElementById('status').innerText = 'connected. ready for drop.';
                document.getElementById('status').style.color = 'green';
                ws.send(JSON.stringify({ type: 'join', pin: roomPin }));
            };

            ws.onerror = (err) => {
                debugLog('WEBSOCKET ERROR — could not connect to the server');
                document.getElementById('status').innerText = 'websocket connection failed';
                document.getElementById('status').style.color = 'red';
            };

            ws.onclose = (event) => {
                debugLog(`websocket closed. code: ${event.code}, reason: "${event.reason}"`);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'file_caught') {
                        document.getElementById('status').innerText = 'they caught it!';
                        document.getElementById('status').style.color = '#00ffff';
                    }
                    if (data.type === 'transfer_declined') {
                        document.getElementById('status').innerText = 'declined.';
                        document.getElementById('status').style.color = 'red';
                    }
                } catch (e) {
                    // not something we understand, just ignore it
                }
            };
        }

        connect();

        let selectedFiles = [];

        document.getElementById('filePicker').addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);

            if (selectedFiles.length > 0) {
                document.getElementById('status').innerText = `${selectedFiles.length} file(s) loaded. ready to flick.`;
                document.getElementById('status').style.color = 'yellow';
            }
        });

        let startY = 0;
        document.body.addEventListener('touchstart', (e) => startY = e.touches[0].clientY);

        document.body.addEventListener('touchend', async (e) => {
            const endY = e.changedTouches[0].clientY;
            const distance = startY - endY;

            if (distance > 100 && selectedFiles.length > 0 && laptopip) {
                document.getElementById('status').innerText = 'dropping massive payload...';
                document.getElementById('status').style.color = 'orange';

                const formData = new FormData();
                selectedFiles.forEach(f => formData.append('files', f));
                formData.append('roomId', roomPin);

                try {
                    const response = await fetch(`http://${laptopip}:3000/api/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        document.getElementById('status').innerText = 'sent — waiting for them to accept';
                        document.getElementById('status').style.color = '#00ffff';
                    }
                } catch (err) {
                    debugLog(`UPLOAD ERROR: ${err.message}`);
                    document.getElementById('status').innerText = 'drop failed.';
                    document.getElementById('status').style.color = 'red';
                }

                selectedFiles = [];
                document.getElementById('filePicker').value = '';
            }
        });
    </script>
</body>
</html>
