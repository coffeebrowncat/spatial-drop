<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            background: transparent;
            transition: all 0.2s ease;
        }

        /* The "Buzz" Effect */
        .buzzing {
            box-shadow: inset 0 0 80px 20px rgba(0, 255, 255, 0.7);
            animation: shake 0.1s linear infinite;
        }

        @keyframes shake {
            0% {
                transform: translate(2px, 1px) rotate(0deg);
            }

            50% {
                transform: translate(-2px, -1px) rotate(1deg);
            }

            100% {
                transform: translate(2px, 1px) rotate(0deg);
            }
        }
    </style>
</head>

<body id="screen-edge">
    <script>
        const { shell } = require('electron');
        const ws = new WebSocket('ws://localhost:3000');
        const edge = document.getElementById('screen-edge');

        ws.onopen = () => ws.send(JSON.stringify({ type: 'join', pin: 'magic-room' }));

        ws.onmessage = (event) => {
            const parsed = JSON.parse(event.data);

            if (parsed.type === 'file_caught') {
                const edge = document.getElementById('screen-edge');

                // 1. Trigger the Buzz
                edge.classList.add('buzzing');

                // 2. Play a subtle system beep (or replace with new Audio('pop.mp3').play())
                new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAAABmYWN0BAAAAAAAAABkYXRhAAAAAA==').play();

                // 3. Open the file
                shell.openPath(parsed.path);

                // 4. Reset after 0.5 seconds
                setTimeout(() => edge.classList.remove('buzzing'), 500);
            }
        };
    </script>
</body>

</html>
