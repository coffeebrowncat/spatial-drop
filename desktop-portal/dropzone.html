<!DOCTYPE html>
<html>

<head>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* this is a REAL, normal, interactive window now - not a fake
           drop zone floating inside a click-through overlay. that's
           the whole point: windows' native file-drag system simply
           does not work inside a click-through window, no matter what
           javascript you throw at it, so this had to become a real
           separate window instead */
        #dropZone {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.6);
            color: #00ffff;
            font-family: monospace;
            font-size: 20px;
            letter-spacing: 4px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: background 0.15s ease-out, border-color 0.15s ease-out;
        }

        #dropZone.armed {
            background: rgba(0, 255, 255, 0.15);
            border-color: rgba(0, 255, 255, 0.9);
        }

        #dropZone span {
            font-size: 10px;
            letter-spacing: 1px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div id="dropZone">
        ----
        <span>drop here</span>
    </div>

    <script>
        const fs = require('fs');
        const path = require('path');
        const { webUtils } = require('electron');

        const dropZone = document.getElementById('dropZone');

        // show the current pin, same trick as before
        fetch('http://localhost:3000/api/pin')
            .then(res => res.json())
            .then(data => {
                dropZone.firstChild.textContent = data.pin;
            })
            .catch(err => console.error('couldnt fetch pin for the badge:', err));

        // NO more ipcRenderer, no more forwarding tricks needed at all -
        // this window is just a normal window, so normal drag events
        // just work, exactly like they would on any regular webpage
        dropZone.addEventListener('dragenter', (e) => {
            e.preventDefault();
            console.log('dragenter fired');
            dropZone.classList.add('armed');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            console.log('dragleave fired');
            dropZone.classList.remove('armed');
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault(); // required, or "drop" never fires
        });

        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            console.log('drop fired');
            dropZone.classList.remove('armed');

            const file = e.dataTransfer.files[0];
            console.log('dropped file:', file);

            if (!file) {
                console.log('no file found in the drop, stopping here');
                return;
            }

            // NEW: newer Electron versions removed the old file.path shortcut for
            // security reasons - webUtils.getPathForFile() is the modern
            // replacement, does the same job
            const filePath = webUtils.getPathForFile(file);
            console.log('resolved file path:', filePath);

            if (!filePath) {
                console.log('couldnt resolve a real path for this file, stopping here');
                return;
            }

            const buffer = fs.readFileSync(filePath);
            const blob = new Blob([buffer]);
            const filename = path.basename(filePath);

            const formData = new FormData();
            formData.append('files', blob, filename);

            const pinRes = await fetch('http://localhost:3000/api/pin');
            const { pin } = await pinRes.json();
            formData.append('roomId', pin);
            formData.append('role', 'desktop'); // NEW

            console.log('uploading dropped file now...');
            await fetch('http://localhost:3000/api/upload', { method: 'POST', body: formData });
            console.log('upload finished');
        });
    </script>
</body>

</html>
