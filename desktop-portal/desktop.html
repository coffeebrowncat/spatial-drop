<!DOCTYPE html>
<html>

<head>
    <style>
        /* this whole window is invisible on purpose - it just sits on
           top of your entire screen, completely see-through, until we
           need it to flash a glow */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
        }

        /* the "canvas" that the glow effect actually gets painted onto */
        #overlay {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid transparent;
            transition: all 0.15s ease-out; /* fast snap instead of a slow fade */
        }

        /* this class gets added/removed by javascript to turn the glow on/off.
           recolored to match COLORS.amber (now #8C1A3F, deep cherry/burgundy)
           instead of the old teal — same family as the mobile app and
           superhub.html now. opacity kept at 0.3 (close to the original
           teal's 0.301) so the intensity doesn't change, just the hue —
           at full-screen scale it should still read as a felt "thump"
           pulse, not an alert flash. */
        .buzzing {
            /* you NEED some tiny bit of background here or some computers
               just refuse to render the glow at all, it's a weird quirk */
            background: rgba(0, 0, 0, 0.001) !important;
            box-shadow: inset 0 0 50px 10px rgba(140, 26, 63, 0.3) !important;
            animation: haptic-shake 0.1s linear infinite;
        }

        /* this is what makes the screen look like it's "shaking" -
           it just nudges everything a couple pixels in different
           directions super fast, over and over */
        @keyframes haptic-shake {
            0% {
                transform: translate(3px, 2px);
            }

            25% {
                transform: translate(-3px, -2px);
            }

            50% {
                transform: translate(3px, -1px);
            }

            75% {
                transform: translate(-2px, 3px);
            }

            100% {
                transform: translate(1px, -3px);
            }
        }

        /* NEW — replaces the native browser confirm() dialog, which was
           ugly, blocking, and looked nothing like the rest of the app
           (system font, system chrome, no way to style it at all).
           colors pulled straight from superhub.html's already-established
           palette (graphite bg, cherry accents) instead of inventing new
           ones, so this actually looks like it belongs to the same app. */
        #transferModal {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 300px;
            background: rgba(18, 17, 16, 0.95);
            border: 1px solid rgba(77, 1, 25, 0.5);
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            padding: 18px 20px;
            font-family: -apple-system, sans-serif;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        #transferModal.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #transferModal .modalTitle {
            color: #F2EDE6;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        #transferModal .modalFiles {
            color: #8A8580;
            font-size: 11px;
            line-height: 1.5;
            max-height: 80px;
            overflow-y: auto;
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #transferModal .modalButtons {
            display: flex;
            gap: 10px;
        }

        #transferModal button {
            flex: 1;
            border: none;
            border-radius: 20px;
            padding: 9px 0;
            font-family: -apple-system, sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        #transferModal .declineBtn {
            background: transparent;
            border: 1px solid rgba(138, 133, 128, 0.3);
            color: #8A8580;
        }

        #transferModal .acceptBtn {
            background: rgba(140, 26, 63, 0.85);
            color: #F2EDE6;
        }
    </style>
</head>

<body>
    <!-- this empty div is literally the entire visible page, it's just
         a blank rectangle that covers your whole screen -->
    <div id="overlay"></div>

    <!-- shows the current pin AND doubles as the drag-and-drop target -->
    <div id="dropZone">
        ----
        <span>drop here</span>
    </div>

    <!-- NEW — replaces confirm(). hidden/inert until an incoming_files
         message actually shows it. -->
    <div id="transferModal">
        <div class="modalTitle" id="modalTitle">incoming files</div>
        <div class="modalFiles" id="modalFiles"></div>
        <div class="modalButtons">
            <button class="declineBtn" id="declineBtn">decline</button>
            <button class="acceptBtn" id="acceptBtn">accept</button>
        </div>
    </div>

    <script>
        // lets us use real desktop features (like opening files) even though
        // this is technically just a webpage
        const { shell, ipcRenderer } = require('electron');
        const fs = require('fs');
        const path = require('path');
        const os = require('os'); // NEW — used below so the phone shows your laptop's actual name instead of "unknown device"

        // NEW: read the shared machine id main.js passed in, instead of
        // generating our own — this is what lets the server recognize
        // desktop.html and dropzone.html as the same physical laptop
        const deviceId = new URLSearchParams(window.location.search).get('deviceId');

        // connect to our own server, since the widget runs on the
        // same computer the server lives on, we can just say "localhost"
        const ws = new WebSocket('ws://localhost:3000');

        // ONE shared audio context, made once, reused forever.
        // (we used to make a brand new one every single buzz, which was
        // wasteful and could eventually straight up stop working)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // since the pin now changes every launch instead of always
        // being "magic-room", we ask our own server what it currently
        // is before joining - same trick as the badge above
        ws.onopen = async () => {
            console.log("desktop ghost window connected.");

            const res = await fetch('http://localhost:3000/api/pin');
            const { pin } = await res.json();

            // FIXED — this never sent a label at all, which is exactly why
            // your phone was showing "unknown device": the server had
            // nothing to fall back to. os.hostname() is your actual
            // computer's name (whatever shows in your system settings) —
            // swap the string default below if you'd rather it always say
            // something specific like 'laptop'.
            ws.send(JSON.stringify({ type: 'join', pin, role: 'desktop', deviceId, label: os.hostname() || 'laptop' }));
        };

        // --- THE HAPTIC FUNCTION ---
        // this is the thing that makes the screen glow, shake, and go "thump"
        // "paths" can be: null (just testing), one path, or a whole list of paths
        function triggerHapticFeedback(paths) {
            const overlay = document.getElementById('overlay');

            // 1. turn the glow + shake on
            overlay.classList.add('buzzing');

            // 2. make a deep "thump" sound using raw sound waves instead of
            //    an actual sound file - basically faking a physical impact
            const oscillator = audioCtx.createOscillator(); // the thing that makes the tone
            const gainNode = audioCtx.createGain();          // the thing that controls volume

            oscillator.type = 'sine'; // smooth, round wave, not harsh/buzzy
            oscillator.frequency.setValueAtTime(30, audioCtx.currentTime); // super low = felt more than heard

            // start LOUD, then rapidly fade to basically silent - that's
            // what makes it sound like a quick physical "hit" instead of a beep
            gainNode.gain.setValueAtTime(1.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

            // wire the tone generator into the volume control, and the
            // volume control into your actual speakers
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.25); // auto-stops itself after a quarter second

            // 3. SMART OPEN — one file vs a whole batch behave differently.
            //    wrapped in try/catch so if this ever throws, it can't
            //    silently kill the glow cooldown below it - the glow
            //    is now guaranteed to turn back off no matter what
            try {
                if (paths && paths.length === 1) {
                    // just one file? pop it open directly, easy
                    shell.openPath(paths[0]);
                } else if (paths && paths.length > 1) {
                    // a bunch of files? don't open 10 windows, just open the
                    // folder they're sitting in so you can see them all at once
                    shell.showItemInFolder(paths[0]);
                }
            } catch (err) {
                console.error("couldn't open the file/folder:", err);
            }

            // 4. turn the glow back off after a short cooldown
            setTimeout(() => {
                overlay.classList.remove('buzzing');
            }, 400);
        }

        // --- NEW: the modal that replaces confirm() ---
        // this window is click-through by default (setIgnoreMouseEvents in
        // main.js) so the transparent overlay never blocks clicks on
        // whatever's behind it. that's a problem the second we need real
        // buttons on screen — a click-through window can't receive a click
        // on its own buttons either. so: tell main.js to turn click-through
        // OFF right before the modal appears, and back ON the instant it's
        // resolved (accept, decline, or timeout), so the rest of the
        // fullscreen overlay stays exactly as invisible/unclickable as
        // before.
        const modal = document.getElementById('transferModal');
        const modalFiles = document.getElementById('modalFiles');
        const acceptBtn = document.getElementById('acceptBtn');
        const declineBtn = document.getElementById('declineBtn');

        function showTransferModal(label, fileNames) {
            return new Promise((resolve) => {
                modalFiles.textContent = fileNames.join('\n');
                document.getElementById('modalTitle').textContent = `accept ${label}?`;
                modal.classList.add('show');
                ipcRenderer.send('modal-visibility', true);

                // auto-decline after 20s so an ignored request doesn't just
                // sit there forever leaving the sender hanging with no answer
                const autoDecline = setTimeout(() => finish(false), 20000);

                function finish(accepted) {
                    clearTimeout(autoDecline);
                    modal.classList.remove('show');
                    ipcRenderer.send('modal-visibility', false);
                    acceptBtn.removeEventListener('click', onAccept);
                    declineBtn.removeEventListener('click', onDecline);
                    resolve(accepted);
                }

                function onAccept() { finish(true); }
                function onDecline() { finish(false); }

                acceptBtn.addEventListener('click', onAccept);
                declineBtn.addEventListener('click', onDecline);
            });
        }

        // --- REAL TRIGGER: stuff coming from the phone ---
        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);

            // the phone just sent files and is asking "hey, want these?"
            if (data.type === 'incoming_files') {
                // if the server already trusts this pairing (you said
                // yes once already this session), skip the popup entirely
                // and just silently accept - this is the "seamless" part
                if (data.trusted) {
                    console.log("already trusted this pairing, skipping the popup.");
                    ws.send(JSON.stringify({ type: 'accept_transfer', transferId: data.transferId }));
                    return;
                }

                // first time seeing this pairing this session, so actually ask
                // CHANGED — was a native confirm() dialog (system font,
                // system chrome, freezes the page until dismissed). now a
                // real styled card matching the rest of the app, and it
                // doesn't block anything else while it's up.
                const label = data.count > 1 ? `${data.count} files` : 'a file';
                const accepted = await showTransferModal(label, data.fileNames);

                ws.send(JSON.stringify({
                    type: accepted ? 'accept_transfer' : 'decline_transfer',
                    transferId: data.transferId
                }));
                return;
            }

            // the server already moved the files to downloads for real,
            // now go ahead and do the glow/shake/thump/open
            if (data.type === 'file_caught') {
                console.log('file_caught received, paths:', data.paths);
                triggerHapticFeedback(data.paths);
            }

            // NEW — this message type existed on the server already but
            // desktop.html never did anything with it. forward the peer
            // list to superhub.html via main.js, so the drawer can show
            // real orbs instead of nothing.
            if (data.type === 'room_update') {
                ipcRenderer.send('peers-updated', data.peers.filter((p) => p.deviceId !== deviceId));
            }
        };

        // --- DEV TRIGGER: press spacebar to test the buzz without sending anything real ---
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                console.log("dev trigger fired!");
                triggerHapticFeedback(null); // null = don't try to open anything
            }
        });
    </script>
</body>
</html>
