<!DOCTYPE html>
<html>

<head>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 99%;
            overflow: hidden;
            background: transparent;
        }

        #drawer {
            width: 100%;
            height: 60%;
            display: flex;
            flex-direction: row;
            font-family: -apple-system, sans-serif;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            overflow: hidden;
        }

        #sliver {
            width: 21px;
            height: 98.5%;
            flex-shrink: 0;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(40, 121, 127, 0.558);
            border-top: 1px solid rgba(44, 168, 199, 0.045);
            border-bottom: 1px solid rgba(44, 168, 199, 0.045);
            cursor: pointer;
        }

        #sliver span {
            font-size: 15px;
            writing-mode: vertical-rl;
            letter-spacing: 2px;
            color: #a2a8a8;
            transform: rotate(270deg);
        }

        #content {
            flex: 1;
            background: rgba(20, 135, 217, 0.034);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-top: 1px solid rgba(44, 168, 199, 0.045);
            border-bottom: 1px solid rgba(44, 168, 199, 0.045);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }

        #drawer.open #content {
            opacity: 1;
            pointer-events: auto;
        }

        .orb-wrap {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: transform 0.15s ease;
        }

        .orb {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: radial-gradient(circle, #c9a084, #5a463a);
            box-shadow: 0 0 0 1px rgba(240, 201, 138, 0.15);
        }

        .orb-wrap.drag-over .orb {
            background: radial-gradient(circle, #fff6e0, #f0c98a);
            transform: scale(1.15);
        }

        .orb-label {
            font-size: 9px;
            color: #8a6a52;
        }

        #dropHint {
            font-size: 0px;
            letter-spacing: 1px;
            color: #4a3a30;
        }
    </style>
</head>

<body>
    <div id="drawer">
        <div id="sliver"><span id="pinBadge">----</span></div>

        <div id="content">
            <div id="peerField" style="position:relative; width:260px; height:180px;"></div>
            <div id="dropHint">drop anywhere to send to everyone — drop on a device to target it</div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const fs = require('fs');
        const path = require('path');
        const { webUtils } = require('electron');

        const deviceId = new URLSearchParams(window.location.search).get('deviceId');
        const drawer = document.getElementById('drawer');
        let peers = [];
        let currentPin = null;

        fetch('http://localhost:3000/api/pin')
            .then((res) => res.json())
            .then((data) => {
                currentPin = data.pin;
                document.getElementById('pinBadge').innerHTML = data.pin.split('').join('<br>');
            })
            .catch((err) => console.error('couldnt fetch pin:', err));

        ipcRenderer.on('peers-updated', (event, updatedPeers) => {
            peers = updatedPeers;
            renderPeers();
        });

        function peerPosition(i, total) {
            const angle = (i / Math.max(total, 1)) * Math.PI * 2;
            return { x: Math.cos(angle) * 70, y: Math.cos(angle) * 0 + Math.sin(angle) * 60 };
        }

        function renderPeers() {
            const field = document.getElementById('peerField');
            field.innerHTML = '';
            peers.forEach((peer, i) => {
                const { x, y } = peerPosition(i, peers.length);
                const wrap = document.createElement('div');
                wrap.className = 'orb-wrap';
                wrap.dataset.deviceId = peer.deviceId;
                wrap.style.left = `${130 + x - 13}px`;
                wrap.style.top = `${90 + y - 13}px`;
                wrap.innerHTML = `<div class="orb"></div><div class="orb-label">${peer.label}</div>`;
                field.appendChild(wrap);
            });
        }

        let closeTimer = null;
        let isDrawerOpen = false;

        function keepOpen() {
            clearTimeout(closeTimer);

            if (!isDrawerOpen) {
                isDrawerOpen = true;
                drawer.classList.add('open');
                ipcRenderer.send('superhub-slide', true);
            }

            closeTimer = setTimeout(() => {
                isDrawerOpen = false;
                drawer.classList.remove('open');
                ipcRenderer.send('superhub-slide', false);
            }, 400);
        }

        const sliver = document.getElementById('sliver');

        sliver.addEventListener('mouseenter', () => {
            clearTimeout(closeTimer);
            if (!isDrawerOpen) {
                isDrawerOpen = true;
                drawer.classList.add('open');
                ipcRenderer.send('superhub-slide', true);
            }
        });

        drawer.addEventListener('mouseleave', () => {
            closeTimer = setTimeout(() => {
                isDrawerOpen = false;
                drawer.classList.remove('open');
                ipcRenderer.send('superhub-slide', false);
            }, 300);
        });

        document.body.addEventListener('dragenter', (e) => {
            e.preventDefault();
            keepOpen();
        });

        document.body.addEventListener('dragover', (e) => {
            e.preventDefault();
            keepOpen();

            document.querySelectorAll('.orb-wrap').forEach((el) => {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
                el.classList.toggle('drag-over', dist < 30);
            });
        });

        document.body.addEventListener('dragleave', (e) => {
            e.preventDefault();
        });

        // FIXED — this had been reduced to a placeholder comment,
        // meaning drops silently did nothing at all. this is the real,
        // complete handler again, with the shared deviceId (read from
        // the URL above) included — that's the line that lets the
        // server tell "the laptop sent this" apart from "a phone sent
        // this," which is what stops the laptop from notifying/
        // accepting its own uploads.
        document.body.addEventListener('drop', async (e) => {
            e.preventDefault();
            clearTimeout(closeTimer);

            const file = e.dataTransfer.files[0];
            if (!file) return;

            const filePath = webUtils.getPathForFile(file);
            if (!filePath) return;

            let targetId = null;
            document.querySelectorAll('.orb-wrap').forEach((el) => {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
                if (dist < 30) targetId = el.dataset.deviceId;
            });

            const buffer = fs.readFileSync(filePath);
            const blob = new Blob([buffer]);
            const filename = path.basename(filePath);

            const formData = new FormData();
            formData.append('files', blob, filename);
            formData.append('roomId', currentPin);
            formData.append('deviceId', deviceId);
            if (targetId) formData.append('targetId', targetId);

            console.log('uploading dropped file, target:', targetId || 'everyone');
            await fetch('http://localhost:3000/api/upload', { method: 'POST', body: formData });
            console.log('upload finished');

            document.querySelectorAll('.orb-wrap').forEach((el) => el.classList.remove('drag-over'));

            setTimeout(() => {
                isDrawerOpen = false;
                drawer.classList.remove('open');
                ipcRenderer.send('superhub-slide', false);
            }, 700);
        });
    </script>
</body>

</html>
