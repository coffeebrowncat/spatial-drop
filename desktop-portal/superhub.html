<!DOCTYPE html>
<html>

<head>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 99%;
            overflow: hidden;
            background: transparent;
        }

        #drawer {
            width: 100%;
            /* FIXED — was 60%. paired with main.js's DRAWER_HEIGHT shrinking
               from 240 to 144, this lands on the exact same ~142.56px visible
               drawer size as before — see the comment on DRAWER_HEIGHT in
               main.js for the math and an important note about needing a
               real restart (not electron-reload's hot reload) to see it. */
            height: 100%;
            display: flex;
            flex-direction: row;
            font-family: -apple-system, sans-serif;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            overflow: hidden;
        }

        /* recolored off the mobile app's real palette (constants/colors.js)
           — graphite bezel background, cherry-tinted hairline borders.
           this used to be a straight teal/blue tab (rgba(40,121,127,...)
           for the sliver, rgba(20,135,217,...) for the content wash) —
           that's fixed now, along with the muted greys being pushed
           slightly warm to match the rest of the graphite palette
           instead of flat #666666. */
        /* brighter than #content on purpose now (0.95 vs 0.6) so the sliver
           actually reads as its own visible tab at rest, and the border is
           just a slightly lighter shade of the SAME background color
           instead of a contrasting cherry line — reads as one seamless
           bezel instead of a color outline sitting on top of it */
        #sliver {
            width: 21px;
            height: 98.5%;
            flex-shrink: 0;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background:  rgba(77, 1, 25, 0.493);
            border-top: 1px solid rgba(77, 1, 25, 0.4);
            border-bottom: 1px solid rgba(77, 1, 25, 0.4);
            cursor: pointer;
        }

        #sliver span {
            font-size: 15px;
            writing-mode: vertical-rl;
            letter-spacing: 2px;
            color: #8A8580;
            /* COLORS.mutedText */
            transform: rotate(270deg);
        }

        #content {
            flex: 1;
            background: rgba(18, 17, 16, 0.6);
            /* dark, matching COLORS.bg, instead of the old blue tint */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-top: 1px solid rgba(77, 1, 25, 0.4);
            border-bottom: 1px solid rgba(77, 1, 25, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }

        #drawer.open #content {
            opacity: 1;
            pointer-events: auto;
        }

        /* FIXED (round 8) — every version of this so far hand-computed
           pixel x/y offsets (position:absolute) and tried to guess where
           the visual center of "orb + label below it" actually landed,
           across several rounds that each got the guess wrong in a new
           way (clipped, overlapping, or unevenly balanced). switched to
           real flexbox rows instead — #peerField and .peer-row below now
           do the centering, so it's exactly right regardless of orb size,
           label size, or row count, with nothing left to hand-tune. */
        #peerField {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            width: 100%;
        }

        .peer-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 34px;
        }

        .orb-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: transform 0.15s ease;
        }

        /* CHANGED — was a single flat grey gradient for every peer without
           an avatar, so two avatar-less peers were only tellable apart by
           reading their label text. now the background color itself is
           picked per-peer (see tonesFor() in the script), reusing the same
           rose-cherry NODE_TONES family the mobile radar screen already
           hashes its peer markers from — different peers read as visibly
           different orbs, and it's the same palette instead of a new one.
           the radial-gradient below is just a light/dark sheen over
           whatever solid color gets set inline per-orb. */
        .orb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.18), rgba(0,0,0,0.22));
            background-blend-mode: overlay;
            box-shadow: 0 0 0 1px rgba(138, 133, 128, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            line-height: 1;
            overflow: hidden; /* NEW — keeps the square avatar art clipped to the circle instead of poking out the corners */
        }

        /* the fallback initial letter, only shown when there's no avatar image */
        .orb-initial {
            color: #F2EDE6; /* COLORS.text */
            font-size: 13px;
            font-weight: 600;
        }

        /* FIXED — border-radius directly on the <img> itself (not just
           relying on .orb's overflow:hidden above) is what actually
           forces a circular crop regardless of what the source PNG
           looks like — square, white background, whatever. object-fit:
           cover fills the whole circle without stretching, cropping any
           excess instead of leaving a gap around the edges. */
        .orb img {
            width: 33px;
            height: 33px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* drag-over = targeted = cherry, matching COLORS.amber's new value
           exactly, same as the "outgoing" node color on mobile */
        .orb-wrap.drag-over .orb {
            background: radial-gradient(circle, #FCE8ED, #D9708F);
            box-shadow: 0 0 0 1px rgba(140, 26, 63, 0.5);
            transform: scale(1.15);
        }

        .orb-label {
            font-size: 9px;
            color: #8A8580;
            /* COLORS.mutedText */
        }

        #dropHint {
            font-size: 0px;
            letter-spacing: 1px;
            color: #8A8580;
            /* COLORS.mutedText — was invisible before too (font-size: 0), left as-is, just made the color consistent in case that ever gets fixed */
            height: 0;
            overflow: hidden;
            /* NEW — font-size:0 alone doesn't guarantee a true 0px box in
               every rendering engine (line-box "struts" can leave a few
               stray px depending on font metrics). height:0 + overflow:hidden
               makes it actually zero, so it can never nudge #peerField's
               centering above by some unpredictable amount. */
        }
    </style>
</head>

<body>
    <div id="drawer">
        <div id="sliver"><span id="pinBadge">----</span></div>

        <div id="content">
            <!-- FIXED (round 8) — no more fixed width/height guess here.
                 #peerField is a real flex column now (see CSS) that sizes
                 itself to whatever rows renderPeers() actually builds, and
                 #content's existing centering handles placing it — so it's
                 correctly centered and never clipped, for any peer count,
                 without hand-picking a box size that happens to fit. -->
            <div id="peerField"></div>
            <div id="dropHint">drop anywhere to send to everyone — drop on a device to target it</div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const fs = require('fs');
        const path = require('path');
        const { webUtils } = require('electron');

        const deviceId = new URLSearchParams(window.location.search).get('deviceId');
        const drawer = document.getElementById('drawer');
        let peers = [];
        let currentPin = null;

        // CHANGED — matches AVATAR_PRESETS in mobile/components/AvatarPicker.js,
        // ids and all. used to map straight to an emoji character; now maps
        // to a real PNG sitting in an 'avatars' folder next to this file
        // (same level as main.js/desktop.html/superhub.html) — drop the same
        // 9 (soon 10) files you gave the mobile app in here too. avatarId
        // passthrough itself is already working (server.js's room_update
        // sends it, confirmed live), this just changes what renderPeers()
        // does with it below.
        // FIXED — these were pointing at renamed filenames
        // (methcrackhead.png, coolLadyHehe.png, mrMime.png) that don't
        // actually exist on disk. your AvatarPicker.js kept your real
        // original filenames, so this now matches those exactly — same
        // ids on the left (what the server sends), your actual filenames
        // on the right (what's sitting in the avatars/ folder).
        const AVATAR_IMAGE = {
            wiseOldCreep: 'avatars/wiseOldCreep.png',
            methcrackhead: 'avatars/edwardScissorNOHands.png',
            coolLadyHehe: 'avatars/dontEvenJokeLad(y).png',
            roidedDudeWithBow: 'avatars/roidedDudeWithBow.png',
            hijabiNinja: 'avatars/hijabiNinja.png',
            punkRockEntity: 'avatars/punkRockEntity.png',
            ancientKarateLady: 'avatars/ancientKarateLady.png',
            mrMime: 'avatars/mr.mime.png',
            creepyChild: 'avatars/creepyChild.png',
            // smirkingCat: 'avatars/smirkingCat.png', // NEW — uncomment once that file exists
        };

        fetch('http://localhost:3000/api/pin')
            .then((res) => res.json())
            .then((data) => {
                currentPin = data.pin;
                document.getElementById('pinBadge').innerHTML = data.pin.split('').join('<br>');
            })
            .catch((err) => console.error('couldnt fetch pin:', err));

        ipcRenderer.on('peers-updated', (event, updatedPeers) => {
            peers = updatedPeers;
            renderPeers();
        });

        // splits peers into up to 2 rows for renderPeers() below. bottom
        // row gets the ceiling on an odd split — 3 peers = 1 up, 2 down,
        // evenly spread around center — same rule for every count from
        // there (5 = 2 up, 3 down, etc).
        function splitIntoRows(total) {
            if (total <= 2) return [total, 0];
            const bottomRowCount = Math.ceil(total / 2);
            return [total - bottomRowCount, bottomRowCount];
        }

        // same rose-cherry family as NODE_TONES in the mobile app's
        // constants/colors.js — reusing it here instead of inventing a new
        // palette keeps avatar-less peers consistent across platforms.
        // only the 4 richer/darker tones made the cut (dropped the two
        // lightest, E8A0B0/D9708F — too washed out for the white initial
        // letter below to read clearly against them).
        const FALLBACK_TONES = ['#C94A6E', '#B8214F', '#9E1A45', '#8C1A3F'];

        // cheap string hash so the same deviceId always lands on the same
        // tone (stable across re-renders) without needing a real UUID lib
        function toneForDevice(deviceId) {
            let hash = 0;
            for (let i = 0; i < deviceId.length; i++) {
                hash = (hash * 31 + deviceId.charCodeAt(i)) | 0;
            }
            return FALLBACK_TONES[Math.abs(hash) % FALLBACK_TONES.length];
        }

        function makeOrbWrap(peer) {
            const wrap = document.createElement('div');
            wrap.className = 'orb-wrap';
            wrap.dataset.deviceId = peer.deviceId;
            const avatarSrc = AVATAR_IMAGE[peer.avatarId]; // undefined if it's an old/unknown id — falls back to the tone+initial below
            let orbContent, orbStyle;
            if (avatarSrc) {
                // NEW — onerror hides the broken-image icon and logs exactly
                // which file/path actually failed, instead of leaving a
                // silent broken icon with no way to tell what went wrong.
                orbContent = `<img src="${avatarSrc}" alt="" onerror="this.style.display='none'; console.error('avatar image failed to load:', this.src, '— check that the file actually exists at that path in the avatars/ folder');">`;
                orbStyle = '';
            } else {
                // CHANGED — was always the same flat grey circle. now a
                // per-device cherry tone plus the peer's first initial, so
                // avatar-less peers are visually distinct from each other
                // instead of all looking identical.
                const initial = (peer.label || '?').trim().charAt(0).toUpperCase();
                orbContent = `<span class="orb-initial">${initial}</span>`;
                orbStyle = ` style="background-color: ${toneForDevice(peer.deviceId)}"`;
            }
            wrap.innerHTML = `<div class="orb"${orbStyle}>${orbContent}</div><div class="orb-label">${peer.label}</div>`;
            return wrap;
        }

        // FIXED (round 8) — replaced hand-computed absolute x/y (several
        // rounds of guessing pixel offsets, each one wrong in a new way —
        // clipped against the drawer edge, rows overlapping, or unevenly
        // balanced top-to-bottom) with real DOM rows: #peerField and
        // .peer-row are flexbox now (see CSS), so the browser centers
        // everything correctly on its own — nothing left to mis-measure.
        function renderPeers() {
            const field = document.getElementById('peerField');
            field.innerHTML = '';

            const [topCount, bottomCount] = splitIntoRows(peers.length);
            const topPeers = peers.slice(0, topCount);
            const bottomPeers = peers.slice(topCount);

            [topPeers, bottomPeers].forEach((rowPeers, rowIndex) => {
                if (rowPeers.length === 0) return;
                const rowEl = document.createElement('div');
                rowEl.className = 'peer-row';
                // ZIGZAG — when both rows hold the SAME count, two
                // independently-centered rows land on identical x
                // positions, so every bottom-row orb sits directly under
                // a top-row one. shifting the bottom row by half a column
                // (half of .peer-row's 34px gap) breaks that up — same
                // effect that happens for free when the counts differ
                // (e.g. 3 peers: the lone top orb naturally lands in the
                // gap between the bottom two).
                if (rowIndex === 1 && rowPeers.length === topPeers.length) {
                    rowEl.style.transform = 'translateX(17px)';
                }
                rowPeers.forEach((peer) => rowEl.appendChild(makeOrbWrap(peer)));
                field.appendChild(rowEl);
            });
        }

        let closeTimer = null;
        let isDrawerOpen = false;

        function keepOpen() {
            clearTimeout(closeTimer);

            if (!isDrawerOpen) {
                isDrawerOpen = true;
                drawer.classList.add('open');
                ipcRenderer.send('superhub-slide', true);
            }

            closeTimer = setTimeout(() => {
                isDrawerOpen = false;
                drawer.classList.remove('open');
                ipcRenderer.send('superhub-slide', false);
            }, 400);
        }

        const sliver = document.getElementById('sliver');

        sliver.addEventListener('mouseenter', () => {
            clearTimeout(closeTimer);
            if (!isDrawerOpen) {
                isDrawerOpen = true;
                drawer.classList.add('open');
                ipcRenderer.send('superhub-slide', true);
            }
        });

        drawer.addEventListener('mouseleave', () => {
            closeTimer = setTimeout(() => {
                isDrawerOpen = false;
                drawer.classList.remove('open');
                ipcRenderer.send('superhub-slide', false);
            }, 300);
        });

        document.body.addEventListener('dragenter', (e) => {
            e.preventDefault();
            keepOpen();
        });

        document.body.addEventListener('dragover', (e) => {
            e.preventDefault();
            keepOpen();

            document.querySelectorAll('.orb-wrap').forEach((el) => {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
                // FIXED — was 30. two vertically-stacked orbs now sit only
                // 46px apart (rowSpacing above), and two same-size hit
                // circles that close together would overlap and make the
                // wrong row "win" a drop near the boundary between them.
                // 20 keeps each orb's hit zone safely inside half that
                // gap (23px) instead of spilling into its neighbor's.
                el.classList.toggle('drag-over', dist < 20);
            });
        });

        document.body.addEventListener('dragleave', (e) => {
            e.preventDefault();
        });

        document.body.addEventListener('drop', async (e) => {
            e.preventDefault();
            clearTimeout(closeTimer);

            const file = e.dataTransfer.files[0];
            if (!file) return;

            const filePath = webUtils.getPathForFile(file);
            if (!filePath) return;

            let targetId = null;
            document.querySelectorAll('.orb-wrap').forEach((el) => {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
                if (dist < 20) targetId = el.dataset.deviceId;
            });

            const buffer = fs.readFileSync(filePath);
            const blob = new Blob([buffer]);
            const filename = path.basename(filePath);

            const formData = new FormData();
            formData.append('files', blob, filename);
            formData.append('roomId', currentPin);
            formData.append('deviceId', deviceId);
            if (targetId) formData.append('targetId', targetId);

            console.log('uploading dropped file, target:', targetId || 'everyone');
            await fetch('http://localhost:3000/api/upload', { method: 'POST', body: formData });
            console.log('upload finished');

            document.querySelectorAll('.orb-wrap').forEach((el) => el.classList.remove('drag-over'));

            setTimeout(() => {
                isDrawerOpen = false;
                drawer.classList.remove('open');
                ipcRenderer.send('superhub-slide', false);
            }, 700);
        });
    </script>
</body>

</html>
